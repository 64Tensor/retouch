packages:
  - packages/*
  - playground
  - desktop

# Install scripts that don't run. fabric brings node-canvas along for use in Node, and ONNX
# Runtime brings protobufjs; Rétouch runs in the browser, and the tests mock the canvas. The Mac
# app's packager brings electron-winstaller, for Windows installers it doesn't make.
allowBuilds:
  canvas: false
  electron-winstaller: false
  protobufjs: false

# Tools and test libraries are pinned exactly. The packages' own runtime dependencies keep caret
# ranges in their package.json, so an app using Rétouch can share one copy with its own.
saveExact: true
