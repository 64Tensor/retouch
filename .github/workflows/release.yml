name: Release

# On every push to main: if there are changesets, open or update the "Version packages" pull
# request. If there are none and a package's version isn't on npm yet (that pull request was just
# merged), publish both packages, tag them and write the GitHub releases.

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases and the version branch
  pull-requests: write # the "Version packages" pull request
  id-token: write # npm trusted publishing, which also signs the provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: Version packages
          commit-message: Version packages
          create-github-releases: true
        env:
          # changeset publish runs pnpm publish, and pnpm 12 reads settings only from PNPM_CONFIG_*
          # variables. 0.3.0 went out with NPM_CONFIG_PROVENANCE, which pnpm ignored, so unsigned.
          PNPM_CONFIG_PROVENANCE: "true"
          # npm sets up trusted publishing only for packages that exist, so the first publish,
          # which creates them, signs in with a short-lived token kept in the npm environment.
          # Once trusted publishing is set up, the secret is deleted and this is empty.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
